<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Adviento">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Nuestro Adviento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6EFE4; --paper:#FCF8F2; --beige:#EADFCD; --line:#E2D4BF;
  --wine:#7B2D3B; --wine-d:#5C1F2A; --rose:#E6C2BC; --rose-l:#F4E2DE;
  --green:#2F4737; --green-l:#DCE5DC; --gold:#B8925A; --ink:#38282A; --muted:#8B766B;
  --serif:'Fraunces', Georgia, serif; --sans:'DM Sans', system-ui, sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%,rgba(230,194,188,.45),transparent 45%),
  radial-gradient(circle at 100% 30%,rgba(220,229,220,.6),transparent 40%);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
textarea,input,select{font:inherit;color:var(--ink)}
.app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 40px)}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:38px;line-height:1.05;margin:4px 0 0;color:var(--wine-d)}
h1 span{font-style:normal;font-weight:600;color:var(--green)}
.icons{display:flex;gap:6px;margin-top:4px}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--wine)}
.ibtn svg{width:20px;height:20px}
.sub{margin:10px 0 0;color:var(--muted);font-size:15px}

/* progress */
.prog{margin:20px 0 18px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog b{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--wine-d)}
.prog small{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--beige);border-radius:9px;margin-top:10px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;transition:width .6s ease}
.bar .o{background:var(--rose)}
.bar .d{background:var(--wine)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.box{position:relative;aspect-ratio:1/1.08;border-radius:12px;perspective:600px;padding:0}
.box .inside{position:absolute;inset:0;border-radius:12px;background:var(--paper);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.box .inside .n{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--wine-d)}
.box .inside svg{width:14px;height:14px;color:var(--gold)}
.box.done .inside{background:var(--rose-l);border-color:var(--rose)}
.box.done .inside svg{color:var(--wine)}
.box .door{position:absolute;inset:0;border-radius:12px;transform-origin:left center;transition:transform .55s cubic-bezier(.5,.1,.3,1),opacity .55s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#F8EEDD;
  box-shadow:inset 0 0 0 1px rgba(184,146,90,.55),inset 0 0 0 4px rgba(0,0,0,.06),0 2px 6px rgba(60,30,30,.12);backface-visibility:hidden}
.box .door .n{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1}
.box .door svg{width:13px;height:13px;opacity:.85;color:#E7C99A}
.c0 .door{background:linear-gradient(160deg,#8A3444,var(--wine-d))}
.c1 .door{background:linear-gradient(160deg,#3A5744,#243729)}
.c2 .door{background:linear-gradient(160deg,#B9746F,#94524F)}
.box.open .door,.box.done .door{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.box.locked .door{filter:saturate(.55) brightness(1.05);opacity:.75}
.box.today .door::after,.box.today .inside::after{content:'';position:absolute;inset:-4px;border-radius:15px;border:2px solid var(--gold)}
.box .lock{position:absolute;top:6px;right:6px;width:11px;height:11px;opacity:.8}
.box:active .door{transform:scale(.96)}
.box.wide{grid-column:1/-1;aspect-ratio:auto;height:78px}
.box.wide .door,.box.wide .inside{flex-direction:row;gap:12px}
.box.wide .door .n,.box.wide .inside .n{font-size:26px}
.box.wide .lbl{font-family:var(--serif);font-style:italic;font-size:17px}
.box.wide .door{transform-origin:center top}
.box.wide.open .door,.box.wide.done .door{transform:rotateX(100deg)}
.box.wide .inside .lbl{color:var(--wine-d)}

.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;font-style:italic;font-family:var(--serif)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--cream);transform:translateY(100%);transition:transform .38s cubic-bezier(.3,.8,.3,1),visibility 0s .38s;overflow:hidden}
.sheet.show{transition:transform .38s cubic-bezier(.3,.8,.3,1),visibility 0s}
.sheet{visibility:hidden}.sheet.show{transform:none;visibility:visible}
.sheet .bar-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--st) + 10px) 14px 10px;border-bottom:1px solid var(--line);background:rgba(246,239,228,.94);backdrop-filter:blur(8px)}
.sheet .bar-top .mid{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500;text-align:center}
.sheet .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .body{max-width:560px;margin:0 auto;padding:22px 20px calc(var(--sb) + 40px)}
.navs{display:flex;gap:4px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.cat-recuerdos{background:#F1E3CC;color:#7A5A2A}
.cat-emocion{background:var(--rose-l);color:var(--wine)}
.cat-intimidad{background:#EBCFD3;color:#6E1F33}
.cat-reflexion{background:var(--green-l);color:var(--green)}
.cat-futuro{background:#E3E1EE;color:#4A436E}
.cat-reto{background:#F3DDC4;color:#8A4A1E}
.daynum{font-family:var(--serif);font-size:15px;color:var(--muted);margin:16px 0 2px;font-style:italic}
.dtitle{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.12;margin:0;color:var(--wine-d)}
.dq{font-family:var(--serif);font-size:22px;line-height:1.38;margin:16px 0 0;color:var(--ink)}
.dq.blur{filter:blur(7px);user-select:none;cursor:pointer}
.reveal-hint{font-size:13px;color:var(--muted);margin-top:6px}
.reveal-in{animation:rv .7s ease both}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.seg{display:flex;background:var(--beige);border-radius:12px;padding:3px;margin:24px 0 10px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--wine-d);box-shadow:0 1px 3px rgba(60,30,30,.1)}
.modehelp{font-size:13px;color:var(--muted);margin:0 0 14px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--wine);margin-bottom:6px}
.card textarea{width:100%;min-height:96px;border:0;background:transparent;resize:vertical;outline:none;font-size:16px;line-height:1.5}
.card textarea.hid{filter:blur(6px);pointer-events:none}
.mini{font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;gap:4px;align-items:center;padding:4px 8px;border-radius:8px;background:var(--cream)}
.saved{font-size:12px;color:var(--muted);height:16px;text-align:right;margin:-6px 2px 8px}

.primary{width:100%;padding:15px;border-radius:14px;background:var(--wine);color:#FBF2E6;font-weight:600;font-size:16px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.primary.isdone{background:var(--green)}
.primary:active{transform:scale(.99)}
.secondary{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-weight:500;margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.actions button{padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--wine-d);display:flex;flex-direction:column;align-items:center;gap:4px}
.actions svg{width:18px;height:18px}
.gentle{text-align:center;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;margin-top:22px}

/* capsule */
.capsule{margin-top:26px;padding:20px 18px;border-radius:18px;background:linear-gradient(170deg,#FFFBF4,#F3E7D5);border:1px solid var(--line);position:relative;overflow:hidden}
.capsule h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px;color:var(--wine-d)}
.capsule p{margin:0 0 12px;color:var(--muted);font-size:14px}
.capsule textarea{width:100%;min-height:220px;border:0;outline:none;resize:vertical;font-family:var(--serif);font-size:18px;line-height:1.6;
  background:repeating-linear-gradient(transparent 0 28px,rgba(184,146,90,.22) 28px 29px);background-attachment:local;padding-top:2px}
.env{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
.env svg{width:150px;height:110px}
.env .when{font-family:var(--serif);font-size:19px;color:var(--wine-d);margin:10px 0 2px}
.env .cd{font-size:14px;color:var(--muted)}
.sealedtxt{font-family:var(--serif);font-size:18px;line-height:1.6;white-space:pre-wrap;margin:6px 0 0}

/* summary & settings */
.page h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0;color:var(--wine-d)}
.page .lead{color:var(--muted);margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;color:var(--wine)}
.stat span{font-size:12px;color:var(--muted)}
.mem{border-left:2px solid var(--rose);padding:2px 0 2px 14px;margin:0 0 20px}
.mem .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mem .t{font-family:var(--serif);font-size:19px;color:var(--wine-d);margin:2px 0 6px}
.mem .who{font-size:13px;font-weight:600;color:var(--wine);margin-top:6px}
.mem .txt{white-space:pre-wrap;font-size:15px}
.empty{color:var(--muted);font-style:italic;font-family:var(--serif);text-align:center;padding:24px 0}
.sect{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--wine);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:16px;outline:none}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);margin-bottom:8px;text-align:left;width:100%}
.opt.on{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.opt.on .dot{border:5px solid var(--wine)}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:13px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);width:100%;text-align:left}
.switch .k{flex:none;width:46px;height:28px;border-radius:99px;background:var(--beige);position:relative;transition:background .2s}
.switch .k::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on .k{background:var(--wine)}
.switch.on .k::after{transform:translateX(18px)}
.note{font-size:14px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.danger{color:#9B2C2C;border-color:#E9C4C0}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(56,40,42,.38);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.modal .mbox{width:100%;max-width:560px;background:var(--cream);border-radius:22px 22px 0 0;padding:22px 20px calc(var(--sb) + 22px);transform:translateY(30px);transition:transform .3s;max-height:88vh;overflow-y:auto}
.modal.show .mbox{transform:none}
.mbox h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 8px;color:var(--wine-d)}
.mbox p{color:var(--muted);margin:0 0 14px}
.mrow{display:flex;gap:8px;margin-top:12px}
.mrow button{flex:1;margin:0}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 24px);transform:translate(-50%,20px);background:var(--ink);color:#F8EEDD;padding:11px 18px;border-radius:99px;font-size:14px;z-index:50;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.warn{background:#F6E1D6;color:#7A3A22;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}

.welcome{text-align:center;padding-top:10px}
.welcome .big{font-family:var(--serif);font-style:italic;font-size:44px;line-height:1.05;color:var(--wine-d);margin:18px 0 10px}
.welcome p{color:var(--muted);margin:0 auto 22px;max-width:380px}
.heartline{width:64px;height:64px;margin:0 auto;color:var(--wine)}
.hint{background:var(--paper);border:1px solid var(--rose);border-radius:14px;padding:12px 14px;font-size:14px;text-align:left;margin:0 0 18px;color:var(--ink)}
.shr{display:inline-flex;vertical-align:-2px;color:#2F6FDB}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em}
.link{display:block;margin:16px auto 0;color:var(--wine);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;margin:0 0 14px -4px}
.back svg{width:18px;height:18px}
.welcome .primary,.welcome .secondary{margin-top:10px}
.bigcode{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:44px;letter-spacing:.18em;color:var(--wine-d);background:var(--paper);border:1px dashed var(--gold);border-radius:16px;padding:14px 0 14px .18em;margin:4px 0 14px}
.codein{text-transform:uppercase;font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.2em;font-size:20px!important}
.invite{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--rose-l);border:1px solid var(--rose)}
.invite small{color:var(--muted)}
.pill{flex:none;background:var(--wine);color:#FBF2E6;font-weight:600;font-size:14px;padding:9px 16px;border-radius:99px}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6E9B74;margin-left:6px;vertical-align:1px}
.sync.off{background:#C9894E}
.tag{font-weight:500;color:var(--muted);font-size:12px}
.status{font-size:15px;color:var(--muted);font-style:italic;font-family:var(--serif);padding:6px 0 4px}
.status.ready{color:var(--green);font-style:normal;font-family:var(--sans);display:flex;gap:6px;align-items:center}
.answer{white-space:pre-wrap;font-size:16px;line-height:1.5;padding:2px 0 4px}
.send{width:100%;margin-top:6px;padding:11px;border-radius:12px;background:var(--wine);color:#FBF2E6;font-weight:600}
.sent{display:flex;align-items:center;gap:6px;color:var(--green);font-size:13px;font-weight:500;margin-top:4px}
.ping{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 3px rgba(123,45,59,.2)}
.pulse{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(.85);opacity:.6}}
input:disabled{opacity:.7}
@media (min-width:500px){.grid{gap:12px}.box .door .n,.box .inside .n{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="bar-top" id="sheetTop"></div>
  <div class="scroll" id="sheetScroll"><div class="body" id="sheetBody"></div></div>
</section>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
/* ---------- contenido ---------- */
const CATS = {
  recuerdos:{l:'Recuerdos', i:'star'},
  emocion:{l:'Conexión', i:'heart'},
  intimidad:{l:'Intimidad', i:'flame'},
  reflexion:{l:'Reflexión', i:'leaf'},
  futuro:{l:'Futuro', i:'spark'},
  reto:{l:'Reto', i:'gift'}
};
const MODES = {
  juntos:{l:'Juntos', h:'Abrid la pregunta y hablad. Si queréis, apuntad lo que no queráis olvidar.'},
  individual:{l:'Cada uno', h:'Cada uno escribe su respuesta sin mirar. Después, desvelad y comparad.'},
  conjunta:{l:'Conjunta', h:'Escribid juntos una sola respuesta o recuerdo.'},
  reto:{l:'Reto', h:'Aquí no hay que responder: hay que hacerlo. Apuntad cómo fue, si os apetece.'}
};
const DAYS = [
 ['Nuestro día favorito','¿Qué día que pasamos juntos repetirías exactamente igual?','recuerdos','juntos'],
 ['Nuestro sexo favorito','¿Cuál ha sido nuestro encuentro sexual favorito y qué lo hizo especial?','intimidad','juntos'],
 ['Nuestra comida favorita','¿Cuál ha sido la mejor comida o cena que hemos compartido?','recuerdos','juntos'],
 ['Nuestro desayuno favorito','¿Qué desayuno juntos recuerdas con más cariño?','recuerdos','juntos'],
 ['La mayor carcajada','¿Cuál fue el momento en el que más nos reímos?','recuerdos','juntos'],
 ['Una primera vez','¿Qué primera vez que vivimos juntos te hizo especial ilusión?','recuerdos','juntos'],
 ['Un detalle inolvidable','¿Qué pequeño gesto mío te hizo sentir especialmente querido/a?','emocion','individual'],
 ['Nuestra mejor aventura','¿Qué viaje, excursión o plan improvisado recuerdas con más cariño?','recuerdos','juntos'],
 ['Lo que descubrí de ti','¿Qué has descubierto de mí este año que no esperabas?','emocion','individual'],
 ['El beso que recuerdas','¿Hay algún beso nuestro que recuerdes especialmente?','intimidad','juntos'],
 ['Nuestro momento más absurdo','Contemos una anécdota nuestra que todavía nos haga reír.','recuerdos','conjunta'],
 ['Lo que más me atrae','Dime tres cosas de mí que te resulten especialmente atractivas, físicas o no.','intimidad','individual'],
 ['Un momento cotidiano','¿Qué momento aparentemente normal de nuestra rutina te hace feliz?','emocion','juntos'],
 ['Una canción nuestra','Elegimos una canción que represente este año juntos y explicamos por qué.','reto','reto'],
 ['Cuando me sentí querido/a','¿En qué momento te sentiste especialmente cuidado/a por mí?','emocion','individual'],

/* ---------- servidor ---------- */
async function ensureSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session)return session.user;
  const {data,error}=await sb.auth.signInAnonymously();
  if(error)throw error;
  return data.user;
}
async function findMembership(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return null;
  const {data,error}=await sb.from('members').select('couple_id,slot').eq('user_id',session.user.id).maybeSingle();
  if(error)throw error;
  return data;
}
async function loadAll(coupleId,me){
  const [c,m,d,a,st]=await Promise.all([
    sb.from('couples').select('*').eq('id',coupleId).single(),
    sb.from('members').select('slot,name').eq('couple_id',coupleId),
    sb.from('days').select('*').eq('couple_id',coupleId),
    sb.from('answers').select('n,slot,body,submitted').eq('couple_id',coupleId),
    sb.rpc('answer_status',{p_couple:coupleId})
  ]);
  for(const r of [c,m,d,a,st])if(r.error)throw r.error;
  const prev=S;const N=emptyState();
  N.coupleId=coupleId;N.me=me;N.code=c.data.code;N.year=c.data.year;N.unlock=c.data.unlock;
  N.capsule={text:c.data.capsule_text,sealed:c.data.capsule_sealed,sealedAt:c.data.capsule_sealed_at,openedEarly:c.data.capsule_opened_early};
  for(const r of m.data){N.names[r.slot]=r.name;N.joined[r.slot]=true;}
  for(const r of d.data)N.days[r.n]={opened:r.opened,done:r.done,mode:r.mode,custom:r.custom,shared_note:r.shared_note};
  for(const r of a.data){(N.answers[r.n]||(N.answers[r.n]={}))[r.slot]={body:r.body,submitted:r.submitted};}
  for(const r of st.data){(N.status[r.n]||(N.status[r.n]={}))[r.slot]=r.submitted;}
  // conservar lo que el usuario está escribiendo y aún no se ha guardado
  if(prev&&prev.coupleId===coupleId){
    for(const k of dirty){
      const [t,x]=k.split(':');const n=+x;
      if(t==='note')N.days[n]=Object.assign(N.days[n]||{opened:true,done:false,mode:null,custom:null},{shared_note:prev.days[n]?.shared_note??''});
      if(t==='ans'){(N.answers[n]||(N.answers[n]={}))[me]=Object.assign({submitted:false},N.answers[n]?.[me],{body:prev.answers[n]?.[me]?.body??''});}
      if(t==='capsule')N.capsule.text=prev.capsule.text;
      if(t==='name')N.names[me]=prev.names[me];
    }
  }
  S=N;cacheState();
}
function queue(key,fn,delay=600){
  dirty.add(key);
  clearTimeout((pending.get(key)||{}).t);
  const job={fn,t:setTimeout(()=>runJob(key),delay)};
  pending.set(key,job);
}
async function runJob(key){
  const job=pending.get(key);if(!job)return;
  try{await job.fn();pending.delete(key);dirty.delete(key);flashSaved();}
  catch(e){setSyncState(false);}
}
function flushAll(){for(const k of [...pending.keys()]){clearTimeout(pending.get(k).t);runJob(k);}}
async function write(p){const {error}=await p;if(error)throw error;setSyncState(true);}
function dayPatch(n,fields,immediate){
  Object.assign(D(n),fields);
  const key='day:'+n+':'+Object.keys(fields).join(',');
  const fn=()=>write(sb.from('days').upsert({couple_id:S.coupleId,n,...fields,updated_at:new Date().toISOString()},{onConflict:'couple_id,n'}));
  if(immediate){fn().catch(()=>{setSyncState(false);queue(key,fn,4000);});}else queue(key,fn);
  cacheState();
}
function coupleUpdate(fields){
  return write(sb.from('couples').update(fields).eq('id',S.coupleId)).catch(e=>{setSyncState(false);toast('No se pudo guardar. Revisa la conexión.');});
}
let online=true;
function setSyncState(ok){if(ok===online)return;online=ok;const el=$('#syncDot');if(el)el.classList.toggle('off',!ok);if(!ok)toast('Sin conexión. Guardaremos al volver.');}

/* ---------- tiempo real ---------- */
let channel=null,refreshT=null;
function subscribe(){
  if(channel)sb.removeChannel(channel);
  const id=S.coupleId;
  channel=sb.channel('pareja-'+id);
  for(const t of ['days','answers','members'])channel.on('postgres_changes',{event:'*',schema:'public',table:t,filter:`couple_id=eq.${id}`},scheduleRefresh);
  channel.on('postgres_changes',{event:'*',schema:'public',table:'couples',filter:`id=eq.${id}`},scheduleRefresh);
  channel.subscribe();
}
function scheduleRefresh(){clearTimeout(refreshT);refreshT=setTimeout(refresh,400);}
let renderPending=false;
async function refresh(){
  if(!S||!S.coupleId)return;
  try{
    const m=await findMembership();
    if(!m){S=null;ls.set('adviento-cache',null);view='welcome';closeSheetSilently();renderHome();return;}
    await loadAll(m.couple_id,m.slot);setSyncState(true);
  }catch(e){setSyncState(false);return;}
  rerender();
}
function rerender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&$('#sheet').contains(a)){renderPending=true;return;}
  renderPending=false;
  if($('#sheet').classList.contains('show')){
    if(current)renderDay();else if($('#sheet').dataset.page)$('#sheetBody').innerHTML=$('#sheet').dataset.page==='summary'?renderSummary():renderSettings();
  }
  renderHome();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending)rerender();},50));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){flushAll();refresh();}else flushAll();});
window.addEventListener('online',()=>{flushAll();refresh();});
setInterval(()=>{if(document.visibilityState==='visible')refresh();},30000);

  catch(e){modal(`<h3>Copiar</h3><p>Mantén pulsado el texto para copiarlo.</p><label class="field"><textarea readonly style="min-height:160px">${esc(txt)}</textarea></label><button class="secondary" data-c>Cerrar</button>`,m=>{m.querySelector('[data-c]').onclick=closeModal;const ta=m.querySelector('textarea');ta.focus();ta.select();});}

function capsuleHTML(){
  const cp=S.capsule,openDate=new Date(S.year+1,11,31),now=new Date();
  if(!cp.sealed) return `<div class="capsule"><h3>Carta para nosotros de dentro de un año</h3>
    <p>La escribís entre los dos, cada uno desde su móvil. Al sellarla, quedará guardada hasta el 31 de diciembre de ${S.year+1}.</p>
    <textarea data-capsule placeholder="Queridos nosotros del próximo diciembre…">${esc(cp.text)}</textarea>
    <button class="secondary" data-seal style="margin-top:10px">Sellar la cápsula</button></div>`;
  const ready=now>=openDate||cp.openedEarly;
  const days=Math.ceil((openDate-now)/864e5);
  return `<div class="capsule"><div class="env">${envelopeSVG()}
    <div class="when">${ready?'La cápsula está abierta':'Se abrirá el 31 de diciembre de '+(S.year+1)}</div>
    <div class="cd">${ready?'Sellada el '+fmtDate(cp.sealedAt):'Faltan '+days+' días · sellada el '+fmtDate(cp.sealedAt)}</div></div>
    ${ready?`<div class="sealedtxt">${esc(cp.text)||'<i>(La carta está vacía)</i>'}</div>`:`<button class="secondary" data-early style="margin-top:14px">Abrir antes de tiempo</button>`}
  </div>`;
}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso);return `${d.getDate()} de ${MES[d.getMonth()]} de ${d.getFullYear()}`;}
function envelopeSVG(){return `<svg viewBox="0 0 150 110"><rect x="8" y="16" width="134" height="86" rx="6" fill="#F7EDDD" stroke="#D9C5A6"/><path d="M8 22 75 66l67-44" fill="none" stroke="#D9C5A6" stroke-width="1.5"/><circle cx="75" cy="64" r="15" fill="#7B2D3B"/><circle cx="75" cy="64" r="11" fill="none" stroke="#A54A5A" stroke-width="1.5"/><path d="M75 70.5s-6-3.7-6-7.4c0-2 1.4-3.3 3-3.3 1.3 0 2.2.8 3 1.9.8-1.1 1.7-1.9 3-1.9 1.6 0 3 1.3 3 3.3 0 3.7-6 7.4-6 7.4Z" fill="#E7C99A"/></svg>`;}

/* ---------- resumen ---------- */
function dayParts(n){
  const st=S.days[n];const parts=[];
  if(st&&st.shared_note&&st.shared_note.trim())parts.push(['',st.shared_note]);
  for(const s of ['a','b']){
    const a=S.answers[n]?.[s];if(!a||!a.body.trim())continue;
    if(s===S.me)parts.push([nm(s)+(submitted(n,s)?'':' (borrador)'),a.body]);
    else if(submitted(n,S.me)&&submitted(n,s))parts.push([nm(s),a.body]);
  }
  return parts;
}
function renderSummary(){
  const {o,d}=counts();let notes=0,items='';
  for(let n=1;n<=31;n++){
    const parts=dayParts(n);if(!parts.length)continue;notes++;const c=content(n);
    items+=`<div class="mem"><div class="h">Día ${n} · ${CATS[c.c].l}</div><div class="t">${esc(c.t)}</div>${parts.map(([w,t])=>`${w?`<div class="who">${esc(w)}</div>`:''}<div class="txt">${esc(t)}</div>`).join('')}</div>`;
  }
  const cp=S.capsule;
  const capLine=cp.sealed?`Cápsula sellada el ${fmtDate(cp.sealedAt)}. Se abrirá el 31 de diciembre de ${S.year+1}.`:(cp.text.trim()?'La carta del día 31 está empezada, pero aún no la habéis sellado.':'La carta del día 31 está por escribir.');
  return `<div class="page"><h2>Nuestro ${S.year}</h2>
    <p class="lead">${d===31?'Lo habéis completado entero. Qué bonito cierre de año.':'Todo lo que habéis ido guardando, en un solo sitio.'}</p>
    <div class="stats"><div class="stat"><b>${o}</b><span>descubiertos</span></div><div class="stat"><b>${d}</b><span>completados</span></div><div class="stat"><b>${notes}</b><span>recuerdos</span></div></div>
    <div class="note" style="margin-bottom:22px"><b style="color:var(--wine-d)">Cápsula del tiempo.</b> ${capLine}</div>
    ${items||'<div class="empty">Aún no hay recuerdos guardados. Abrid una puerta y empezad.</div>'}
    ${items?`<button class="secondary" data-copyall>Copiar todos los recuerdos</button>`:''}</div>`;
}
function allText(){
  let out=`NUESTRO ADVIENTO ${S.year}\n\n`;
  for(let n=1;n<=31;n++){const p=dayParts(n);if(!p.length)continue;const c=content(n);
    out+=`Día ${n} — ${c.t}\n${c.q}\n${p.map(([w,t])=>(w?w+': ':'')+t).join('\n')}\n\n`;}
  return out.trim();
}

async function afterMembership(res){
  if(res.recovery)ls.set('adviento-recovery-'+res.couple_id,res.recovery);
  S=null;await loadAll(res.couple_id,res.slot);subscribe();
  if(inviteCode)history.replaceState(null,'',location.pathname);
}
async function doCreate(btn){
  const name=$('#fName').value.trim();if(!name){toast('Escribe tu nombre');return;}
  busy(btn,true);
  try{await ensureSession();const {data,error}=await sb.rpc('create_couple',{p_name:name,p_year:defaultYear(),p_unlock:draftUnlock});if(error)throw error;
    await afterMembership(data);created=data;view='created';renderHome();}
  catch(e){toast(errMsg(e));busy(btn,false);}
}
async function doJoin(btn){
  const code=$('#fCode').value.trim().toUpperCase(),name=$('#fName').value.trim();
  if(code.length<6){toast('El código tiene 6 caracteres');return;}if(!name){toast('Escribe tu nombre');return;}
  busy(btn,true);
  try{await ensureSession();const {data,error}=await sb.rpc('join_couple',{p_code:code,p_name:name});if(error)throw error;
    await afterMembership(data);created=data;view='created';renderHome();}
  catch(e){toast(errMsg(e));busy(btn,false);}
}
async function doRecover(btn){
  const code=$('#fCode').value.trim().toUpperCase(),rec=$('#fRec').value.trim().toUpperCase();
  if(code.length<6||rec.length<12){toast('Revisa el código y la clave');return;}
  busy(btn,true);
  try{await ensureSession();const {data,error}=await sb.rpc('recover_member',{p_code:code,p_recovery:rec});if(error)throw error;
    ls.set('adviento-recovery-'+data.couple_id,rec);await afterMembership(data);view='home';renderHome();toast('Acceso recuperado');}
  catch(e){toast(errMsg(e));busy(btn,false);}
}
function defaultYear(){const d=new Date();return d.getMonth()===0&&d.getDate()<15?d.getFullYear()-1:d.getFullYear();}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-unblur]');if(!t||t.disabled)return;
  const ds=t.dataset;
  if(ds.view){view=ds.view;if(view==='home')created=null;renderHome();window.scrollTo(0,0);return;}
  if(t.id==='doCreate'){doCreate(t);return;}
  if(t.id==='doJoin'){doJoin(t);return;}
  if(t.id==='doRecover'){doRecover(t);return;}
  if('invite' in ds){shareInvite();return;}
  if('copyrec' in ds){const r=created?.recovery||ls.get('adviento-recovery-'+S.coupleId,'');copyText(`Nuestro Adviento\nCódigo: ${S.code}\nMi clave de recuperación: ${r}`,'Clave copiada. Guárdala en una nota.');return;}
  if(ds.unlock){
    if(view==='home'){S.unlock=ds.unlock;coupleUpdate({unlock:ds.unlock});}else draftUnlock=ds.unlock;
    document.querySelectorAll('[data-unlock]').forEach(b=>b.classList.toggle('on',b.dataset.unlock===ds.unlock));return;}
  if(!S)return;
  if(ds.day){openDay(+ds.day,t);return;}
  if(ds.go){openPage(ds.go);return;}
  if('close' in ds){closeSheet();return;}
  if('prev' in ds&&current>1){navTo(current-1);return;}
  if('next' in ds&&current<31){navTo(current+1);return;}
  if('unblur' in ds){D(current)._shown=true;renderDay(true);return;}
  if(ds.mode){dayPatch(current,{mode:ds.mode},true);renderDay();return;}
  if('submit' in ds){submitAnswer(current,t);return;}
  if('done' in ds){const n=current,v=!D(n).done;dayPatch(n,{done:v},true);renderDay();if(v)toast(n===31?'Fin del Adviento. Feliz año nuevo, vosotros.':'Día '+n+' completado');return;}
  if('edit' in ds){editDay(current);return;}
  if('swap' in ds){swapDay(current);return;}
  if('share' in ds){const c=content(current);copyText(`Día ${current} — ${c.t}\n${c.q}`,'Pregunta copiada');return;}
  if('seal' in ds){
    flushAll();
    if(!S.capsule.text.trim()){toast('Escribid algo antes de sellarla');return;}
    confirmBox('¿Sellamos la cápsula?',`Ninguno de los dos podrá leerla ni cambiarla hasta el 31 de diciembre de ${S.year+1}.`,'Sellar',async()=>{
      const at=new Date().toISOString();
      ls.set('adviento-capsule-'+S.coupleId,{text:S.capsule.text,sealedAt:at});
      Object.assign(S.capsule,{sealed:true,sealedAt:at});await coupleUpdate({capsule_text:S.capsule.text,capsule_sealed:true,capsule_sealed_at:at});renderDay();toast('Cápsula sellada hasta el próximo diciembre');});return;}
  if('early' in ds){confirmBox('¿Abrirla ya?','La gracia es esperar un año… pero es vuestra carta. Se abrirá para los dos.','Abrir ahora',()=>{S.capsule.openedEarly=true;coupleUpdate({capsule_opened_early:true});renderDay();});return;}
  if('copyall' in ds){copyText(allText(),'Recuerdos copiados');return;}
  if('discreto' in ds){P.discreto=!P.discreto;savePrefs();t.classList.toggle('on',P.discreto);return;}
  if('leave' in ds){confirmBox('¿Salir del calendario?',partnerJoined()?`Este móvil dejará de estar conectado. ${esc(pn()[0].toUpperCase()+pn().slice(1))} conserva el calendario y podrás volver a unirte con el código.`:'Eres la única persona en este calendario: se borrará entero.','Salir',async()=>{
      flushAll();const {error}=await sb.rpc('leave_couple');if(error){toast(errMsg(error));return;}
      if(channel)sb.removeChannel(channel);S=null;ls.set('adviento-cache',null);closeSheetSilently();view='welcome';renderHome();},true);return;}
});
async function submitAnswer(n,btn){
  const body=A(n,S.me).body;if(!body.trim()){toast('Escribe algo antes de enviar');return;}
  busy(btn,true,'Enviando…');
  pending.delete('ans:'+n);dirty.delete('ans:'+n);
  try{
    await write(sb.from('answers').upsert({couple_id:S.coupleId,n,slot:S.me,body,submitted:true,updated_at:new Date().toISOString()},{onConflict:'couple_id,n,slot'}));
    await write(sb.from('days').upsert({couple_id:S.coupleId,n,opened:true,updated_at:new Date().toISOString()},{onConflict:'couple_id,n'}));
    await loadAll(S.coupleId,S.me);renderDay();
    toast(submitted(n,other())?'¡Ya podéis leer las dos respuestas!':'Enviada. Te avisaremos aquí cuando responda.');
  }catch(e){toast('No se pudo enviar. Revisa la conexión.');busy(btn,false);}
}
function navTo(n){
  flushAll();
  if(!isUnlocked(n)){toast(`Esta puerta se abre el ${n} de diciembre`);return;}
  const first=!D(n).opened;if(first)dayPatch(n,{opened:true},true);current=n;renderDay(first);$('#sheetScroll').scrollTop=0;
}
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;if(!S)return;
  if('note' in ds&&current){const n=current;D(n).shared_note=t.value;cacheState();
    queue('note:'+n,()=>write(sb.from('days').upsert({couple_id:S.coupleId,n,shared_note:D(n).shared_note,updated_at:new Date().toISOString()},{onConflict:'couple_id,n'})));}
  else if('ans' in ds&&current){const n=current;A(n,S.me).body=t.value;cacheState();
    queue('ans:'+n,()=>write(sb.from('answers').upsert({couple_id:S.coupleId,n,slot:S.me,body:A(n,S.me).body,updated_at:new Date().toISOString()},{onConflict:'couple_id,n,slot'})));}
  else if('capsule' in ds){S.capsule.text=t.value;cacheState();
    queue('capsule',()=>write(sb.from('couples').update({capsule_text:S.capsule.text}).eq('id',S.coupleId)));}
  else if('myname' in ds){S.names[S.me]=t.value;
    queue('name',()=>write(sb.from('members').update({name:S.names[S.me].trim()}).eq('couple_id',S.coupleId).eq('slot',S.me)),900);}
});
document.addEventListener('change',e=>{
  if('year' in e.target.dataset&&S){S.year=+e.target.value;coupleUpdate({year:S.year});toast('Calendario de '+S.year);}
});

function editDay(n){
  const c=content(n);
  modal(`<h3>Editar día ${n}</h3><p>El cambio lo veréis los dos.</p>
   <label class="field"><span>Título</span><input id="et" value="${esc(c.t)}"></label>
   <label class="field"><span>Pregunta o actividad</span><textarea id="eq">${esc(c.q)}</textarea></label>
   <label class="field"><span>Categoría</span><select id="ec">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===c.c?'selected':''}>${v.l}</option>`).join('')}</select></label>
   <div class="mrow"><button class="secondary" data-c>Cancelar</button><button class="primary" data-ok>Guardar</button></div>
   ${D(n).custom?'<button class="secondary" data-orig style="margin-top:8px">Volver a la pregunta original</button>':''}`,m=>{
    m.querySelector('[data-c]').onclick=closeModal;
    m.querySelector('[data-ok]').onclick=()=>{const t=m.querySelector('#et').value.trim(),q=m.querySelector('#eq').value.trim();if(!t||!q){toast('Falta el título o el texto');return;}
      dayPatch(n,{custom:{t,q,c:m.querySelector('#ec').value}},true);closeModal();renderDay();toast('Día '+n+' actualizado');};
    const o=m.querySelector('[data-orig]');if(o)o.onclick=()=>{dayPatch(n,{custom:null},true);closeModal();renderDay();};
  });
}
function swapDay(n){
  const c=content(n);const list=BANK[c.c]||BANK.recuerdos;
  const used=new Set();for(let i=1;i<=31;i++)used.add(content(i).q);
  let idx=swapIdx[n]||0,pick=null;
  for(let k=0;k<list.length;k++){const cand=list[(idx+k)%list.length];if(!used.has(cand[1])){pick=cand;idx=(idx+k+1)%list.length;break;}}
  if(!pick){pick=list[idx%list.length];idx++;}
  swapIdx[n]=idx;
  dayPatch(n,{custom:{t:pick[0],q:pick[1],c:c.c}},true);renderDay(true);toast('Nueva pregunta de '+CATS[c.c].l.toLowerCase());
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('show'))closeModal();else if($('#sheet').classList.contains('show'))closeSheet();}});

/* ---------- arranque ---------- */
(async function boot(){
  if(!CONFIGURED){view='setup';renderHome();return;}
  const cached=ls.get('adviento-cache',null);
  if(cached&&cached.coupleId){S=cached;view='home';renderHome();}else{renderHome();}
  try{
    const m=await findMembership();
    if(!m){S=null;ls.set('adviento-cache',null);view='welcome';renderHome();return;}
    await loadAll(m.couple_id,m.slot);subscribe();view='home';rerender();
  }catch(e){
    if(S){setSyncState(false);}else{view='welcome';renderHome();toast(errMsg(e));}
  }
})();

</script>
