# Evita que Supabase (plan gratuito) pause el proyecto por inactividad (7 días).
# Hace una consulta ligera a la base de datos cada 3 días.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base de datos
        run: |
          URL="https://gzwsjmkrwugikdsvedec.supabase.co"
          KEY="sb_publishable_qOHj1EtjWVpt3pi4gH3fmQ_CjvSb7iS"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Content-Type: application/json" -d "{}")
          echo "HTTP $code"
          test "$code" = "200"
